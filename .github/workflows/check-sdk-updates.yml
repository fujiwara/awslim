name: Check SDK updates
on:
  schedule:
    - cron: "14 23 * * *"
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: write

jobs:
  check:
    name: Check SDK updates
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout AWS SDK Go v2
        run: |
          git clone --depth=1 https://github.com/aws/aws-sdk-go-v2.git

      - name: Check SDK updates
        id: check-sdk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AWS_SDK_GO_V2_DIR: ./aws-sdk-go-v2
        run: |
          BRANCH_NAME="update-all-services"
          make all-services.yaml
          if git diff --quiet all-services.yaml; then
            echo "No changes detected"
            exit 0
          fi

          # Extract added/removed services from the diff
          ADDED=$(git diff all-services.yaml | grep '^+  ' | sed 's/^+  //' | sed 's/:$//' | sort)
          REMOVED=$(git diff all-services.yaml | grep '^-  ' | sed 's/^-  //' | sed 's/:$//' | sort)
          {
            echo "updated=true"
            echo "added<<EOF"
            echo "$ADDED"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          # Do not touch the open PR if it already has the same all-services.yaml.
          # The build below still runs, as an earlier run may have skipped it.
          PR_NUMBER=$(gh pr list --head "${BRANCH_NAME}" --state open --json number --jq '.[0].number // empty')
          if [[ -n "${PR_NUMBER}" ]] \
            && git fetch --depth=1 origin "${BRANCH_NAME}" \
            && git diff --quiet FETCH_HEAD -- all-services.yaml; then
            echo "PR #${PR_NUMBER} is already up to date"
            exit 0
          fi

          # Build PR title
          ADDED_INLINE=$(echo "$ADDED" | tr '\n' ', ' | sed 's/,$//' | sed 's/,/, /g')
          REMOVED_INLINE=$(echo "$REMOVED" | tr '\n' ', ' | sed 's/,$//' | sed 's/,/, /g')
          if [[ -n "$ADDED" && -n "$REMOVED" ]]; then
            PR_TITLE="Add ${ADDED_INLINE}; Remove ${REMOVED_INLINE} in all-services.yaml"
          elif [[ -n "$ADDED" ]]; then
            PR_TITLE="Add ${ADDED_INLINE} to all-services.yaml"
          elif [[ -n "$REMOVED" ]]; then
            PR_TITLE="Remove ${REMOVED_INLINE} from all-services.yaml"
          else
            PR_TITLE="Update all-services.yaml"
          fi

          # Build PR body
          PR_BODY=""
          if [[ -n "$ADDED" ]]; then
            PR_BODY+="## Added"$'\n'
            while IFS= read -r svc; do
              PR_BODY+="- ${svc}"$'\n'
            done <<< "$ADDED"
            PR_BODY+=$'\n'
          fi
          if [[ -n "$REMOVED" ]]; then
            PR_BODY+="## Removed"$'\n'
            while IFS= read -r svc; do
              PR_BODY+="- ${svc}"$'\n'
            done <<< "$REMOVED"
          fi
          if [[ -z "$PR_BODY" ]]; then
            PR_BODY="Update all-services.yaml"
          fi

          # Recreate the branch from main and force-push to keep a single PR
          git switch -C "${BRANCH_NAME}"
          git add all-services.yaml
          git config --global user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          git config --global user.name "${GITHUB_ACTOR}"
          git commit -m "${PR_TITLE}"
          git push --force --set-upstream origin "${BRANCH_NAME}"
          if [[ -n "${PR_NUMBER}" ]]; then
            gh pr edit "${PR_NUMBER}" --title "${PR_TITLE}" --body "${PR_BODY}"
          else
            gh pr create --title "${PR_TITLE}" --body "${PR_BODY}" --base main --head "${BRANCH_NAME}" --label aws-services
          fi
      - name: make all services
        if: ${{ steps.check-sdk.outputs.updated == 'true' }}
        env:
          ADDED: ${{ steps.check-sdk.outputs.added }}
        run: |
          # A module released just now may not be served by the Go module proxy
          # yet, and go does not fall back to "direct" for it because the parent
          # module (github.com/aws/aws-sdk-go-v2) exists on the proxy.
          # Skip the build in that case instead of failing the workflow.
          # The service list is derived from directory names, so a service
          # without a release tag is not an importable module: fail for it.
          PENDING=""
          INVALID=""
          while IFS= read -r svc; do
            [[ -z "$svc" ]] && continue
            if GOPROXY=https://proxy.golang.org go list -m "github.com/aws/aws-sdk-go-v2/service/${svc}@latest"; then
              continue
            fi
            TAGS=$(git -C aws-sdk-go-v2 ls-remote --tags origin "refs/tags/service/${svc}/v*")
            if [[ -n "$TAGS" ]]; then
              PENDING+=" ${svc}"
            else
              INVALID+=" ${svc}"
            fi
          done <<< "$ADDED"
          if [[ -n "$INVALID" ]]; then
            echo "::error::No release tag in aws-sdk-go-v2, not importable as a module:${INVALID}"
            exit 1
          fi
          if [[ -n "$PENDING" ]]; then
            echo "::warning::Skipped building all services. Released but not available on the Go module proxy yet:${PENDING}"
            exit 0
          fi
          cp all-services.yaml gen.yaml
          make
