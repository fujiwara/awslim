name: tagpr and release
on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      tag:
        description: "release tag"
        required: false
        type: string

permissions:
  pull-requests: write
  packages: write
  contents: write
  actions: write

jobs:
  tagpr:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: Songmu/tagpr@242e22916eb775d6e359959fe3ba5c497de4a01a # v1.20.2
        id: tagpr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: ${{ github.event_name != 'workflow_dispatch' }} # skip on workflow_dispatch
      - name: Determine release tag
        id: tag
        run: echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ inputs.tag || steps.tagpr.outputs.tag }}

  # after tagpr adds a release tag, or workflow_dispatch, generate code for all services once
  # (the generated code is OS/arch independent), then build binaries for each OS/arch in parallel
  # and upload them to the draft release created by tagpr.
  gen:
    needs: tagpr
    if: ${{ needs.tagpr.outputs.tag != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          large-packages: false # slow, and the rest frees enough space
          swap-storage: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tagpr.outputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: false # the module cache for all services is huge and saving it takes minutes

      - name: Generate code for all services
        run: |
          cp all-services.yaml gen.yaml
          make gen

      - name: Upload generated code
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated
          path: |
            gen.yaml
            go.mod
            go.sum
            *_gen.go
            cmd/awslim-gen/gen.go
          if-no-files-found: error
          retention-days: 1

  build:
    needs: [tagpr, gen]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [linux, darwin]
        arch: [amd64, arm64]
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          large-packages: false # slow, and the rest frees enough space
          swap-storage: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tagpr.outputs.tag }}

      - name: Download generated code
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: false # the module cache for all services is huge and saving it takes minutes

      - name: Build for all services
        run: |
          make awslim VERSION="$TAG"
        env:
          TAG: ${{ needs.tagpr.outputs.tag }}
          AWSLIM_OS: ${{ matrix.os }}
          AWSLIM_ARCH: ${{ matrix.arch }}

      - name: Package and upload
        run: |
          name="awslim_${TAG#v}_${AWSLIM_OS}_${AWSLIM_ARCH}"
          tar czf "${name}.tar.gz" awslim LICENSE README.md
          sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
          gh release upload "$TAG" "${name}.tar.gz" "${name}.tar.gz.sha256" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.tagpr.outputs.tag }}
          AWSLIM_OS: ${{ matrix.os }}
          AWSLIM_ARCH: ${{ matrix.arch }}

  # merge checksums and publish the draft release
  release:
    needs: [tagpr, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        run: |
          gh release download "$TAG" --pattern '*.sha256' --dir checksums
          cat checksums/*.sha256 > checksums.txt
          gh release upload "$TAG" checksums.txt --clobber
          for f in checksums/*.sha256; do
            gh release delete-asset "$TAG" "$(basename "$f")" --yes
          done
          gh release edit "$TAG" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.tagpr.outputs.tag }}

  docker:
    needs: tagpr
    if: ${{ needs.tagpr.outputs.tag != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tagpr.outputs.tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Docker Login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: $GITHUB_ACTOR
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: docker
        run: |
          make docker-build-and-push
