changelog:
  exclude:
    labels:
      - tagpr
  categories:
    - title: 💥 Breaking Changes
      labels:
        - tagpr:major
    - title: 🚀 New Features
      labels:
        - tagpr:minor
    - title: ☁️ AWS Service Updates
      labels:
        - aws-services
    - title: 📦 Dependency Updates
      labels:
        - dependencies
    - title: Other Changes
      labels:
        - "*"
